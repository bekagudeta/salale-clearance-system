# Nginx site config. __PORT__ is replaced at container start by entrypoint.sh
# so the server binds to the port Railway injects via $PORT.
server {
    listen __PORT__;
    listen [::]:__PORT__;
    server_name _;

    root /var/www/html/public;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 25M;

    # Serve files directly, fall back to the Laravel front controller
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 120;
    }

    # Deny access to hidden files (except ACME challenge)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
